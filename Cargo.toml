[package]
name = "proctoring-exam-app"
version = "0.1.0"
edition = "2021"

[dependencies]
opencv = { version = "0.92", features = ["clang-runtime"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
cpal = "0.15"  # For audio input
dasp = "0.11"  # Audio processing

# Note: MediaPipe doesn't have official Rust bindings
# We'll use OpenCV's DNN module and cascade classifiers as alternatives
# For production, consider FFI bindings to MediaPipe C++ API

[dev-dependencies]
